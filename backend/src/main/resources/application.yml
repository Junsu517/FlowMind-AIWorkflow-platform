server:
  port: 8080

spring:
  servlet:
    multipart:
      # 5MB 精确限制在 service 层做（DOCUMENT_TOO_LARGE）；这里放宽避免容器先拦成 500
      max-file-size: 32MB
      max-request-size: 33MB
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flowmind}
    password: ${RABBITMQ_PASSWORD:flowmind}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 2
        max-concurrency: 4
  quartz:
    # 内存模式：Quartz 只负责"到点触发"，触发即入 MQ（持久化由 MQ 承担）；
    # 重启丢注册由启动时从 DB 重载计划恢复。集群多实例才需要 JDBC 持久化
    job-store-type: memory
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/flowmind?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

flowmind:
  jwt:
    secret: ${JWT_SECRET:flowmind-dev-jwt-secret-key-must-be-at-least-32-bytes!}
    expire-days: 7
  execution:
    # thread=进程内线程池（本地无 MQ 默认）；mqueue=RabbitMQ 可靠投递（生产 EXECUTION_MODE=mqueue）
    mode: ${EXECUTION_MODE:thread}

deepseek:
  base-url: https://api.deepseek.com/v1
  api-key: ${DEEPSEEK_API_KEY:}

# 阶梯 5 RAG：向量库与向量化服务（Chroma 本地端口 8001，统筹 2026-09 更正）
chroma:
  base-url: ${CHROMA_BASE_URL:http://127.0.0.1:8001}
embedding:
  base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${EMBEDDING_API_KEY:}
  model: BAAI/bge-m3

logging:
  level:
    com.flowmind: info
